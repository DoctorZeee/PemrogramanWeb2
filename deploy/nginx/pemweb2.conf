# Contoh konfigurasi. Ganti domain, document root, sertifikat TLS, dan socket PHP-FPM.
# Laravel disajikan pada /api; prefix /fiber/ diteruskan ke Fiber dan dihilangkan oleh proxy_pass.

server {
    listen 80;
    server_name api.contoh.ac.id app.contoh.ac.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.contoh.ac.id;

    ssl_certificate     /etc/letsencrypt/live/api.contoh.ac.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.contoh.ac.id/privkey.pem;

    root /var/www/pemweb2/latihan-laravel/public;
    index index.php;
    client_max_body_size 2m;

    # Backend Laravel 13: Nginx + PHP-FPM (bukan php artisan serve untuk produksi).
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass unix:/run/php-fpm/www.sock;
    }

    # Backend Fiber v3: /fiber/api/... diteruskan menjadi /api/... ke Fiber.
    location /fiber/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.contoh.ac.id;

    ssl_certificate     /etc/letsencrypt/live/app.contoh.ac.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.contoh.ac.id/privkey.pem;

    root /var/www/pemweb2/frontend-pemweb2/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
